name: dependency-check

# Periodically checks every status:on-hold issue against the
# dependencies declared in its body, and releases it once all of them
# are satisfied — to the role declared as the issue's owner, or to
# agent:software-engineer if none is declared. Owner parsing is
# deliberately tolerant of formatting (inline bullet, plain line, bold,
# or its own heading); see .github/AGENT_LABELS.md.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - name: Check dependencies for every on-hold issue
        run: |
          gh issue list --label "status:on-hold" --state open \
            --json number,body --repo "${{ github.repository }}" \
            | jq -c '.[]' \
            | while read -r issue; do
                NUMBER=$(echo "$issue" | jq -r '.number')
                BODY=$(echo "$issue" | jq -r '.body')

                # Extract "Finish-Start: #N" and "Start-Start: #N" lines
                # Capture EVERY issue number on a dependency line, not just
                # the first. The original pattern anchored on the literal
                # label, so it matched once per line: a plan written as
                # "Finish-Start: #22, #32, #33 ..." collapsed to #22 alone.
                # Measured on SPA-CGAL 2026-08-29, where six issues were
                # released while their real gates were open -- including a
                # documentation issue that began writing up features that had
                # not been built. Over-capturing keeps an issue held, which is
                # the safe direction; under-capturing releases work whose
                # prerequisites do not exist.
                FS_DEPS=$(echo "$BODY" | grep -oE 'Finish-Start:.*' | grep -oE '#[0-9]+' | grep -oE '[0-9]+' || true)
                SS_DEPS=$(echo "$BODY" | grep -oE 'Start-Start:.*'  | grep -oE '#[0-9]+' | grep -oE '[0-9]+' || true)

                ALL_SATISFIED=true

                for DEP in $FS_DEPS; do
                  STATE=$(gh issue view "$DEP" --json state -q '.state' --repo "${{ github.repository }}" 2>/dev/null || echo "UNKNOWN")
                  if [[ "$STATE" != "CLOSED" ]]; then
                    ALL_SATISFIED=false
                  fi
                done

                for DEP in $SS_DEPS; do
                  DEP_LABELS=$(gh issue view "$DEP" --json labels -q '.labels[].name' --repo "${{ github.repository }}" 2>/dev/null || echo "")
                  if echo "$DEP_LABELS" | grep -q "^status:on-hold$"; then
                    ALL_SATISFIED=false
                  fi
                done

                if [[ -z "$FS_DEPS" && -z "$SS_DEPS" ]]; then
                  # No parseable dependencies found -- leave it alone rather
                  # than guess. This should not normally happen; an
                  # on-hold issue should always declare at least one.
                  ALL_SATISFIED=false
                fi

                if [[ "$ALL_SATISFIED" == "true" ]]; then
                  # Who gets it: whichever agent:<role> is declared as the
                  # owner, falling back to software-engineer if none is.
                  #
                  # Parsed tolerantly on purpose. All of these work, because
                  # agents reasonably write ownership more than one way and a
                  # misroute here silently hands work to the wrong role:
                  #     - Owner: agent:ui-designer
                  #     Owner: agent:ui-designer
                  #     **Owner:** `agent:ui-designer`
                  #     ## Owner
                  #     agent:ui-designer
                  # The rule: find the word "Owner", then take the first
                  # agent:<role> on that line or the three lines after it.
                  OWNER=$(printf '%s\n' "$BODY" \
                            | tr -d '\r' \
                            | grep -A3 -iE '(^|[^[:alnum:]])Owner([^[:alnum:]]|$)' \
                            | grep -oE 'agent:[a-z-]+' \
                            | head -1 || true)
                  if [[ -z "$OWNER" ]]; then
                    OWNER="agent:software-engineer"
                    echo "#$NUMBER: no owner declared -- defaulting to $OWNER"
                  fi
                  echo "Releasing #$NUMBER -- all dependencies satisfied -> $OWNER"
                  gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                    --body "All declared dependencies are now satisfied. Releasing to $OWNER."
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "status:on-hold"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --add-label "$OWNER"
                fi
              done
